apiVersion: surfboard.ado/v1
kind: WorkItemTemplate
metadata:
  name: enabler
spec:
  workItemType: Enabler
  parentTypes:
    - Feature
  # Fields the Alliant ADO process actually blocks a push on. System.Description
  # and Custom.EnablerType have no server-side default, so they must be set
  # locally; IterationId / AreaId / State are required but defaulted by ADO.
  requiredFields:
    - System.Title
    - System.Description
    - Custom.EnablerType
  optionalFields:
    - System.AssignedTo
    - System.AreaPath
    - System.IterationPath
    - System.State
    - Microsoft.VSTS.Common.Priority
    - Microsoft.VSTS.Scheduling.Effort
    - Microsoft.VSTS.Common.BusinessValue
    - Microsoft.VSTS.Common.AcceptanceCriteria
  tags:
    allowed: true
  fieldRules:
    System.State:
      type: string
      allowedValues: [Approved, Committed, Done, New, Removed]
    Microsoft.VSTS.Common.Priority:
      type: integer
      allowedValues: [1, 2, 3, 4]
    Custom.EnablerType:
      type: string
      allowedValues:
        - Agile Process Improvement
        - Architectural / Refactor
        - Exploration / Spike
        - Infrastructure
        - Security / Compliance
        - Tech Debt
  unknownFields: warn
