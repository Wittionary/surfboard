apiVersion: surfboard.ado/v1
kind: WorkItemTemplate
metadata:
  name: task
spec:
  workItemType: Task
  parentTypes:
    - PBI
    - Enabler
  # System.Title is the only Task field with no server-side default;
  # everything else ADO marks "required" is auto-filled on create.
  requiredFields:
    - System.Title
  optionalFields:
    - System.Description
    - System.AssignedTo
    - System.AreaPath
    - System.IterationPath
    - System.State
    - Microsoft.VSTS.Common.Priority
    - Microsoft.VSTS.Scheduling.RemainingWork
    - Microsoft.VSTS.Common.Activity
    - Microsoft.VSTS.Scheduling.OriginalEstimate
    - Microsoft.VSTS.Scheduling.CompletedWork
  tags:
    allowed: true
  fieldRules:
    System.State:
      type: string
      allowedValues: ["To Do", "In Progress", Done, Removed]
    Microsoft.VSTS.Common.Priority:
      type: integer
      allowedValues: [1, 2, 3, 4]
    Microsoft.VSTS.Common.Activity:
      type: string
      allowedValues: [Deployment, Design, Development, Documentation, Requirements, Testing]
  unknownFields: warn
