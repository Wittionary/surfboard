apiVersion: surfboard.ado/v1
kind: WorkItemTemplate
metadata:
  name: epic
spec:
  workItemType: Epic
  parentTypes: []
  requiredFields:
    - System.Title
  optionalFields:
    - System.Description
    - System.AssignedTo
    - System.AreaPath
    - System.IterationPath
    - System.State
    - Microsoft.VSTS.Common.Priority
    - Microsoft.VSTS.Common.BusinessValue
  tags:
    allowed: true
  fieldRules:
    Microsoft.VSTS.Common.Priority:
      type: integer
      allowedValues: [1, 2, 3, 4]
  unknownFields: warn
