apiVersion: surfboard.ado/v1
kind: Feature
metadata:
  localId: feature-b9w5j6xz
  adoId: 223729
spec:
  parent:
    localId: epic-215116
    adoId: 215116
  fields:
    System.Title: CI/CD Pipeline for Backstage
    System.Description: Establish a deployment pipeline so changes to Backstage itself (config, plugins, templates) can be shipped reliably without manual intervention.
    Microsoft.VSTS.Common.AcceptanceCriteria: |-
      - A CI/CD pipeline exists that builds and deploys Backstage to Azure on merge to main.
      - Pipeline includes a health check or smoke test post-deploy.
      - Secrets and config are injected at deploy time (not hardcoded).
      - Local dev spin-up is documented and works without cloud dependencies.
---
apiVersion: surfboard.ado/v1
kind: Feature
metadata:
  localId: feature-h2c8v0ld
  adoId: 223730
spec:
  parent:
    localId: epic-215116
    adoId: 215116
  fields:
    System.Title: Security Plugin Integrations (Snyk & SonarQube)
    System.Description: Install and configure the Snyk and SonarQube Backstage plugins so security and code quality data surfaces in the catalog alongside services.
    Microsoft.VSTS.Common.AcceptanceCriteria: |-
      - Snyk plugin is installed and displays vulnerability data for at least one registered service.
      - SonarQube plugin is installed and displays code quality metrics for at least one registered service.
      - Both plugins are gated appropriately via RBAC (read-only for most users).
      - Plugin configuration (API tokens, endpoints) is managed via secrets, not hardcoded.
---
apiVersion: surfboard.ado/v1
kind: Feature
metadata:
  localId: feature-q4s7e1gy
  adoId: 223733
spec:
  parent:
    localId: epic-215116
    adoId: 215116
  fields:
    System.Title: Role-Based Access Control (RBAC)
    System.Description: Install and configure the Spotify RBAC plugin, define the roles/permissions model, and integrate it with the authentication provider.
    Microsoft.VSTS.Common.AcceptanceCriteria: |-
      - RBAC plugin is installed and active.
      - At minimum two roles are defined (e.g., admin, viewer) with distinct permission sets.
      - RBAC integrates with the configured SSO/auth provider — role assignment is driven by group membership.
      - Enforcement is verified: a viewer cannot perform admin actions.
      - Role assignment and RBAC usage is documented for the team.
---
apiVersion: surfboard.ado/v1
kind: Feature
metadata:
  localId: feature-u6d3f9aw
  adoId: 223734
spec:
  parent:
    localId: epic-215116
    adoId: 215116
  fields:
    System.Title: Usable Software Catalog
    System.Description: Define entity standards, establish GitHub-based catalog discovery, and validate that the catalog is populated with clean, ownership-resolved entries.
    Microsoft.VSTS.Common.AcceptanceCriteria: |-
      - Entity definition standard is documented (required fields for a "service": owner, system, lifecycle, repo, etc.).
      - GitHub catalog-info.yaml discovery is configured and working end-to-end.
      - Groups from GitHub Org map cleanly to teams and resolve as owners on entities.
      - Basic validation rules are in place to reject malformed or incomplete entities.
      - At least 3 real services are registered and visible in the catalog.
---
