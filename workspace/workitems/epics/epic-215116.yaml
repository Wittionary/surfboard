  fields:
    System.Title: Operational Readiness
    System.Description: Establish the practices needed to keep Backstage healthy over time — upgrade ownership, secrets management, and basic observability.
    Microsoft.VSTS.Common.AcceptanceCriteria: |-
      - Upgrade strategy is documented: who owns it, what the process is, and how often it should happen.
      - Secrets and plugin config are managed through a defined secrets management approach (e.g., Azure Key Vault).
      - Application logs are accessible to the team (e.g., via Azure Monitor or equivalent).
      - A health check endpoint is configured and monitored.
