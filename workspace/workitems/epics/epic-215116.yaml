    WEF_4C8EED3D0A4A47D2A951ADA2FC741D5E_Kanban.Column.Done: false
    System.Description: |-
      <h1 dir=auto style="margin-top:0px;font-weight:600;margin-bottom:16px;font-size:2em;padding-bottom:0.3em;border-bottom:1px solid rgba(255, 255, 255, 0.18);color:rgb(204, 204, 204);font-family:-apple-system, &quot;system-ui&quot;, &quot;Segoe WPC&quot;, &quot;Segoe UI&quot;, system-ui, Ubuntu, &quot;Droid Sans&quot;, sans-serif;orphans:2;widows:2;">Spotify Backstage Rollout Checklist </h1><h2 dir=auto style="margin-top:24px;font-weight:600;margin-bottom:16px;font-size:1.5em;padding-bottom:0.3em;border-bottom:1px solid rgba(255, 255, 255, 0.18);color:rgb(204, 204, 204);font-family:-apple-system, &quot;system-ui&quot;, &quot;Segoe WPC&quot;, &quot;Segoe UI&quot;, system-ui, Ubuntu, &quot;Droid Sans&quot;, sans-serif;orphans:2;widows:2;">Core Backstage Setup </h2><ul dir=auto style="margin-top:0px;margin-bottom:0.7em;color:rgb(204, 204, 204);font-family:-apple-system, &quot;system-ui&quot;, &quot;Segoe WPC&quot;, &quot;Segoe UI&quot;, system-ui, Ubuntu, &quot;Droid Sans&quot;, sans-serif;orphans:2;widows:2;"><li dir=auto>[ ] Azure Infrastructure<ul dir=auto style="margin-top:0px;margin-bottom:0px;"><li dir=auto>[ ] Hosting (ex: App Services) </li><li dir=auto>[ ] PostgreSQL </li> </ul> </li><li dir=auto>[ ] Configure authentication<ul dir=auto style="margin-top:0px;margin-bottom:0px;"><li dir=auto>[ ] SSO (Github, Okta and/or Azure AD - supports multiple):<span>&nbsp;</span><a href="https://backstage.io/docs/getting-started/config/authentication" style="color:rgb(77, 170, 252);">https://backstage.io/docs/getting-started/config/authentication</a><ul dir=auto style="margin-top:0px;margin-bottom:0.7em;"><li dir=auto>[ ] Github:<span>&nbsp;</span><a href="https://backstage.io/docs/auth/github/provider#create-an-oauth-app-on-github" style="color:rgb(77, 170, 252);">https://backstage.io/docs/auth/github/provider#create-an-oauth-app-on-github</a> </li><li dir=auto>[ ] Okta: [pending] </li><li dir=auto>[ ] Azure AD: [pending] </li> </ul> </li><li dir=auto>[ ] Organization Catalog (users, groups) </li><ul><li dir=auto>[ ] Github:&nbsp;<a href="https://backstage.io/docs/integrations/github/org/">https://backstage.io/docs/integrations/github/org/</a> </li> </ul> </ul> </li><li dir=auto>[ ] Set up CI/CD for Backstage deployment </li> </ul><h2 dir=auto style="margin-top:24px;font-weight:600;margin-bottom:16px;font-size:1.5em;padding-bottom:0.3em;border-bottom:1px solid rgba(255, 255, 255, 0.18);color:rgb(204, 204, 204);font-family:-apple-system, &quot;system-ui&quot;, &quot;Segoe WPC&quot;, &quot;Segoe UI&quot;, system-ui, Ubuntu, &quot;Droid Sans&quot;, sans-serif;orphans:2;widows:2;">Plugins </h2><ul dir=auto style="margin-top:0px;margin-bottom:0.7em;color:rgb(204, 204, 204);font-family:-apple-system, &quot;system-ui&quot;, &quot;Segoe WPC&quot;, &quot;Segoe UI&quot;, system-ui, Ubuntu, &quot;Droid Sans&quot;, sans-serif;orphans:2;widows:2;"><li dir=auto>[ ] Snyk:<span>&nbsp;</span><a href="https://github.com/snyk-tech-services/backstage-plugin-snyk/blob/main/README.md" style="color:rgb(77, 170, 252);">https://github.com/snyk-tech-services/backstage-plugin-snyk/blob/main/README.md</a> </li><li dir=auto>[ ] Sonarqube:<span>&nbsp;</span><a href="https://github.com/backstage/community-plugins/blob/main/workspaces/sonarqube/plugins/sonarqube/README.md" style="color:rgb(77, 170, 252);">https://github.com/backstage/community-plugins/blob/main/workspaces/sonarqube/plugins/sonarqube/README.md</a> </li> </ul><h2 dir=auto style="margin-top:24px;font-weight:600;margin-bottom:16px;font-size:1.5em;padding-bottom:0.3em;border-bottom:1px solid rgba(255, 255, 255, 0.18);color:rgb(204, 204, 204);font-family:-apple-system, &quot;system-ui&quot;, &quot;Segoe WPC&quot;, &quot;Segoe UI&quot;, system-ui, Ubuntu, &quot;Droid Sans&quot;, sans-serif;orphans:2;widows:2;"> </h2><h2 dir=auto style="box-sizing:border-box;color:rgb(204, 204, 204);margin-top:24px;margin-bottom:16px;font-size:1.5em;padding-bottom:0.3em;border-bottom:1px solid rgba(255, 255, 255, 0.18);font-family:-apple-system, &quot;system-ui&quot;, &quot;Segoe WPC&quot;, &quot;Segoe UI&quot;, system-ui, Ubuntu, &quot;Droid Sans&quot;, sans-serif;"><span style="box-sizing:border-box;">Plugin: RBAC (Role-Based Access Control)</span> </h2><ul dir=auto style="box-sizing:border-box;padding:0px 0px 0px 40px;color:rgb(204, 204, 204);font-size:14px;font-weight:400;margin-top:0px;margin-bottom:0.7em;font-family:-apple-system, &quot;system-ui&quot;, &quot;Segoe WPC&quot;, &quot;Segoe UI&quot;, system-ui, Ubuntu, &quot;Droid Sans&quot;, sans-serif;"><li dir=auto style="box-sizing:border-box;">[ ] Review RBAC plugin documentation:<span style="box-sizing:border-box;">&nbsp;</span><a href="https://backstage.spotify.com/docs/plugins/rbac/core-concepts" style="box-sizing:border-box;color:rgb(77, 170, 252);text-decoration:underline;cursor:pointer;">https://backstage.spotify.com/docs/plugins/rbac/core-concepts</a> </li><li dir=auto style="box-sizing:border-box;">[ ] Install RBAC plugin in Backstage:<span style="box-sizing:border-box;">&nbsp;</span><a href="https://backstage.spotify.com/docs/plugins/rbac/setup-and-installation" style="box-sizing:border-box;color:rgb(77, 170, 252);text-decoration:underline;cursor:pointer;">https://backstage.spotify.com/docs/plugins/rbac/setup-and-installation</a> </li><li dir=auto style="box-sizing:border-box;">[ ] Define roles and permissions model </li><li dir=auto style="box-sizing:border-box;">[ ] Integrate RBAC with authentication provider </li><li dir=auto style="box-sizing:border-box;">[ ] Test RBAC enforcement for different user roles </li><li dir=auto style="box-sizing:border-box;">[ ] Document RBAC usage and role assignment process </li> </ul><br> <div><ul><li>local dev spin-up and workflow </li> </ul><div><b>Usable Software Catalog</b> </div><div><ul><li><strong>Entity definition standard</strong><ul><li>
      What does a “service” require? owner, system, lifecycle, repo, etc.
      </li> </ul> </li><li><strong>One ingestion path that works end-to-end</strong><ul><li>
      GitHub catalog-info.yaml discovery </li> </ul> </li><li><strong>Ownership model that resolves cleanly</strong><ul><li>
      Groups map cleanly to teams
      </li> </ul> </li><li><strong>Basic validation</strong><ul><li>
      Prevent garbage entities from polluting the catalog </li> </ul> </li> </ul><br> </div><div><br> </div><div><div><b>Basic operations</b> </div><ul><li><strong>Upgrade strategy</strong><ul><li>Who upgrades and how?
      </li> </ul> </li><li><strong>Secrets/config management</strong><ul><li>
      Especially for plugins and auth providers
      </li> </ul> </li><li><strong>Basic observability</strong><ul><li>
      Logs accessible
      </li><li>
      Health checks </li> </ul> </li> </ul> </div><div><br> </div><div><strong>Scaffolder / Software Templates</strong><br> </div><div>Without templates, Backstage becomes a passive dashboard instead of an entry point into workflows.<br> </div><div><ul><li>Install Scaffolder plugin
      </li><li>
      Create 1 template (even if basic)
      </li><li>
      Hook into GitHub repo creation
      </li><li>
      Auto-register in catalog </li> </ul><br> </div> </div>
    Microsoft.VSTS.Common.AcceptanceCriteria: |-
      <div><p>A developer should be able to: </p><ol><li>
      Log in with SSO
      </li><li>
      Find their team and services in the catalog
      </li><li>
      Click a service and see useful, trusted info
      </li><li>Create a new service via a template </li> </ol><br> </div>
